<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Ehrentag-Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <!-- ───────────── Overview ───────────── -->
      <section id="view-overview">
        <p id="migrated-note" class="notice" hidden></p>

        <canvas id="banner" aria-hidden="true"></canvas>

        <h1 id="title" data-i18n="appTitle">Ehrentag-Manager</h1>
        <p id="subtitle" class="subtitle"></p>
        <p id="today" class="today"></p>

        <h2 id="upcoming-heading" class="upcoming" hidden></h2>
        <div id="cards"></div>
        <p id="overview-note" class="muted" hidden></p>

        <div class="center actions">
          <button id="btn-manage" type="button" class="primary big" data-i18n="manageBtn"></button>
          <button id="btn-settings" type="button" class="big" data-i18n="settingsBtn"></button>
        </div>
      </section>

      <!-- ───────────── Manage / editor ───────────── -->
      <section id="view-manage" hidden>
        <header class="manage-head">
          <h2 data-i18n="manageTitle"></h2>
          <button id="btn-back" type="button" data-i18n="back"></button>
        </header>
        <form id="entry-form" class="panel" autocomplete="off" novalidate>
          <h3 id="form-title"></h3>

          <label class="field">
            <span data-i18n="labelName"></span>
            <input id="f-name" type="text" maxlength="60" data-i18n-ph="nameHint" />
          </label>

          <label class="field">
            <span data-i18n="labelKind"></span>
            <select id="f-kind"></select>
          </label>

          <div class="field">
            <span data-i18n="labelDate"></span>
            <div class="date-row">
              <input id="f-day" type="text" inputmode="numeric" maxlength="2" data-i18n-ph="phDay" aria-label="Day" />
              <span>.</span>
              <input id="f-month" type="text" inputmode="numeric" maxlength="2" data-i18n-ph="phMonth" aria-label="Month" />
              <span>.</span>
              <input id="f-year" type="text" inputmode="numeric" maxlength="4" data-i18n-ph="phYear" aria-label="Year" />
            </div>
          </div>
          <p id="year-hint" class="muted small"></p>

          <div class="row">
            <button id="btn-save" type="submit" class="primary"></button>
            <button id="btn-cancel" type="button" data-i18n="btnCancel" hidden></button>
          </div>
          <p id="form-message" class="message" hidden></p>
        </form>

        <h3 id="list-title"></h3>
        <ul id="entry-list" class="entry-list"></ul>
      </section>

      <!-- ───────────── Settings / configuration ───────────── -->
      <section id="view-settings" hidden>
        <header class="manage-head">
          <h2 data-i18n="settingsBtn"></h2>
          <button id="btn-settings-back" type="button" data-i18n="back"></button>
        </header>

        <div class="panel">
          <h3 data-i18n="settingsTitle"></h3>

          <label class="field">
            <span data-i18n="labelCount"></span>
            <span class="range-row">
              <input id="set-count" type="range" min="1" max="30" step="1" />
              <output id="set-count-out"></output>
            </span>
          </label>

          <label class="field">
            <span data-i18n="labelWithin"></span>
            <span class="range-row">
              <input id="set-days" type="range" min="0" max="366" step="1" />
              <output id="set-days-out"></output>
            </span>
          </label>
          <p class="muted small" data-i18n="settingsHint"></p>

          <label class="field">
            <span data-i18n="labelWarn"></span>
            <span class="range-row">
              <input id="set-warn" type="range" min="0" max="60" step="1" />
              <output id="set-warn-out"></output>
            </span>
          </label>
          <p class="muted small" data-i18n="warnHint"></p>

          <label class="field">
            <span data-i18n="labelLanguage"></span>
            <select id="set-language"></select>
          </label>
        </div>

        <div class="panel">
          <h3 data-i18n="holidaysTitle"></h3>
          <p class="muted small" data-i18n="holidaysHint"></p>
          <div id="traditions"></div>
          <label class="check">
            <input id="set-showholidays" type="checkbox" />
            <span data-i18n="showHolidays"></span>
          </label>
          <label class="field">
            <span data-i18n="labelHolidayCount"></span>
            <span class="range-row">
              <input id="set-hcount" type="range" min="1" max="20" step="1" />
              <output id="set-hcount-out"></output>
            </span>
          </label>
          <p id="hindu-note" class="muted small" hidden></p>
        </div>

        <div class="panel">
          <h3 data-i18n="bannerTitle"></h3>

          <label class="field">
            <span data-i18n="labelBannerText"></span>
            <input id="set-banner" type="text" maxlength="16" placeholder="MARTIN" autocapitalize="characters" />
          </label>
          <p class="muted small" data-i18n="bannerHint"></p>

          <label class="field">
            <span data-i18n="labelSubtitle"></span>
            <select id="set-subtitle"></select>
          </label>

          <label class="field" id="subtext-field" hidden>
            <span data-i18n="labelCustomText"></span>
            <input id="set-subtext" type="text" maxlength="80" />
          </label>
        </div>

        <div class="panel">
          <h3 data-i18n="remindersTitle"></h3>
          <label class="check">
            <input id="set-remind" type="checkbox" />
            <span data-i18n="remindEnable"></span>
          </label>
          <label class="field">
            <span data-i18n="remindAt"></span>
            <select id="set-hour"></select>
          </label>
          <label class="field">
            <span data-i18n="remindBefore"></span>
            <input id="set-before" type="number" min="0" max="30" step="1" inputmode="numeric" />
          </label>
          <p class="muted small" data-i18n="remindNote"></p>
          <p id="remind-message" class="message error" hidden></p>
        </div>

        <div class="panel">
          <h3 data-i18n="importTitle"></h3>
          <p class="muted small" data-i18n="importHelp"></p>
          <label class="check">
            <input id="import-replace" type="checkbox" />
            <span data-i18n="importReplace"></span>
          </label>
          <label class="btn" for="import-file"><span data-i18n="importBtn"></span></label>
          <input id="import-file" type="file" hidden />
          <p id="import-message" class="message" hidden></p>
        </div>

        <div class="panel">
          <h3 data-i18n="exportTitle"></h3>
          <p class="muted small" data-i18n="exportHelp"></p>
          <div class="row">
            <button id="btn-export-ics" type="button" data-i18n="exportIcs"></button>
            <button id="btn-export-json" type="button" data-i18n="exportJson"></button>
          </div>
          <p id="export-message" class="message" hidden></p>
          <div id="export-text" hidden>
            <p id="export-copy-hint" class="muted small"></p>
            <textarea id="export-area" readonly rows="8"></textarea>
            <button id="btn-export-copy" type="button" data-i18n="exportCopyBtn"></button>
          </div>
        </div>

        <div class="panel">
          <p id="file-label" class="muted small"></p>
          <div class="row">
            <button id="btn-about" type="button" data-i18n="aboutBtn"></button>
          </div>
        </div>
      </section>
    </main>

    <!-- ───────────── About dialog ───────────── -->
    <dialog id="about-dialog" aria-labelledby="about-title">
      <h3 id="about-title" data-i18n="aboutBtn"></h3>
      <p class="about-name" data-i18n="appTitle"></p>
      <p id="about-version" class="muted small"></p>
      <dl class="about-list">
        <dt data-i18n="aboutWebsite"></dt>
        <dd><a id="about-website" href="https://github.com/dietmarschnabel-code/ehrentag" data-external>github.com/dietmarschnabel-code/ehrentag</a></dd>
        <dt data-i18n="aboutLicense"></dt>
        <dd>
          MIT License<br />
          <a id="about-license" href="https://github.com/dietmarschnabel-code/ehrentag/blob/main/LICENSE" data-external data-i18n="aboutLicenseLink"></a>
        </dd>
      </dl>
      <p class="muted small">Copyright © 2026 Dietmar Schnabel</p>
      <div class="row">
        <button id="btn-about-close" type="button" class="primary" data-i18n="btnClose"></button>
      </div>
    </dialog>

    <script src="i18n.js"></script>
    <script src="lang/de.js"></script>
    <script src="lang/en.js"></script>
    <script src="lang/es.js"></script>
    <script src="lang/fr.js"></script>
    <script src="lang/it.js"></script>
    <script src="lang/pt.js"></script>
    <script src="lang/ru.js"></script>
    <script src="lang/tr.js"></script>
    <script src="lang/ar.js"></script>
    <script src="lang/hi.js"></script>
    <script src="lang/zh.js"></script>
    <script src="lang/ja.js"></script>
    <script src="logic.js"></script>
    <script src="exchange.js"></script>
    <script src="holidays.js"></script>
    <script src="banner.js"></script>
    <script src="main.js"></script>
  </body>
</html>
