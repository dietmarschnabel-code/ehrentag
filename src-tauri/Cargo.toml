[package]
name = "ehrentag"
version = "1.0.0"
description = "Ehrentag-Manager: birthdays, name days and other dates worth remembering"
authors = ["Dietmar Schnabel"]
license = "MIT"
repository = "https://github.com/dietmarschnabel-code/ehrentag"
edition = "2021"
rust-version = "1.77"

[lib]
# The library name must differ from the binary name; the cdylib/staticlib
# crate types are what the Android (and iOS) builds load.
name = "ehrentag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
