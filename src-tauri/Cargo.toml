[package]
# Must be identical to "productName" in tauri.conf.json (and "name" in package.json): on Linux a window
# announces itself under the name of the program, and the desktop finds the icon through the .desktop file that
# the packages install under the product name. A different name shows a generic icon (scripts/bump-version.js --check
# tests this).
name = "Ehrentag-Manager"
version = "1.0.1"
description = "Ehrentag-Manager: birthdays, name days and other dates worth remembering"
authors = ["Dietmar Schnabel"]
license = "MIT"
repository = "https://github.com/dietmarschnabel-code/ehrentag"
edition = "2021"
rust-version = "1.77"

[lib]
# The library name must differ from the binary name; the cdylib/staticlib
# crate types are what the Android (and iOS) builds load.
name = "ehrentag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
