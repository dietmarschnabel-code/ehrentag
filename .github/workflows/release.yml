name: Release

# New release: bump the version in package.json, src-tauri/Cargo.toml and
# src-tauri/tauri.conf.json, commit, then
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: JavaScript tests
        run: |
          node tests/logic.test.js
          node tests/i18n.test.js
          node tests/exchange.test.js
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux .deb + .rpm
            os: ubuntu-22.04
            args: "--bundles deb,rpm"
          - name: Windows NSIS installer
            os: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Ehrentag-Manager ${{ github.ref_name }}"
          releaseBody: "Download the installer for your system below. See the README for installation notes."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Android (.apk)
    needs: desktop
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    # The Android build is the youngest part of the toolchain: a failure here must not
    # block the desktop release.
    continue-on-error: true
    env:
      NDK_VERSION: "27.0.12077973"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - name: Create the Android project (if it is not committed) and its icons
        run: |
          if [ ! -d src-tauri/gen/android ]; then npx tauri android init; fi
          npx tauri icon app-icon.png
      - name: Build the APK
        run: npx tauri android build --apk
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK=$(find src-tauri/gen/android -name "*-release-unsigned.apk" | head -n1)
          if [ -z "$APK" ]; then echo "::error::No release APK found"; exit 1; fi
          mkdir -p dist
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key configured (see README). Unsigned APKs cannot be installed, so nothing is published."
            cp "$APK" dist/unsigned.apk
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --out "dist/Ehrentag-Manager_${GITHUB_REF_NAME#v}_android.apk" aligned.apk
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
      - name: Attach the signed APK to the release
        if: hashFiles('dist/Ehrentag-Manager_*_android.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Ehrentag-Manager_*_android.apk

  checksums:
    name: Checksums
    needs: [desktop, android]
    if: always() && needs.desktop.result == 'success' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Create SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dist && cd dist
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern '*'
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
