name: Release

# New release: bump the version in package.json, src-tauri/Cargo.toml and
# src-tauri/tauri.conf.json, commit, then
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Version numbers agree (and match the tag)
        run: node scripts/bump-version.js --check ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: JavaScript tests
        run: |
          node tests/logic.test.js
          node tests/i18n.test.js
          node tests/exchange.test.js
          node tests/holidays.test.js
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux .deb + .rpm
            os: ubuntu-22.04
            args: "--bundles deb,rpm"
          - name: Windows NSIS installer
            os: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Ehrentag-Manager ${{ github.ref_name }}"
          releaseBody: "Download the installer for your system below. See the README for installation notes."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Android (.aab for Google Play, .apk)
    needs: desktop
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    # The Android build is the youngest part of the toolchain: a failure here must not
    # block the desktop release.
    continue-on-error: true
    env:
      NDK_MAJOR: "30"
      # Optional: force newer Android Gradle Plugin / Gradle versions (empty = keep the template's)
      AGP_VERSION: ""
      GRADLE_VERSION: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # same major version as the JBR bundled in current Android Studio
      - uses: android-actions/setup-android@v3
        with:
          # The action's default package "tools" no longer exists and makes sdkmanager fail
          packages: platform-tools
      - name: Install newest SDK platform, build-tools and NDK ${{ env.NDK_MAJOR }}
        run: |
          set -euo pipefail
          LIST=$(sdkmanager --list 2>/dev/null | awk -F'|' '{gsub(/ /,"",$1); print $1}')

          # Newest stable platform (android-37, android-37.0, ...) and newest stable build-tools
          PLATFORM=$(echo "$LIST" | grep -E '^platforms;android-[0-9]+(\.[0-9]+)?$' | sort -V | tail -n1)
          BUILD_TOOLS=$(echo "$LIST" | grep -E '^build-tools;[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          # Newest stable NDK of the requested major version (skips -beta / -rc builds)
          NDK=$(echo "$LIST" | grep -E "^ndk;${NDK_MAJOR}\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)

          if [ -z "$NDK" ]; then echo "::error::No stable NDK ${NDK_MAJOR} found"; exit 1; fi
          echo "Installing: $PLATFORM, $BUILD_TOOLS, $NDK"
          sdkmanager --install "$PLATFORM" "$BUILD_TOOLS" "$NDK" "platform-tools"

          NDK_VERSION="${NDK#ndk;}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          # API level of the platform, e.g. "android-37.0" -> 37
          API=$(echo "$PLATFORM" | sed -E 's/^platforms;android-([0-9]+).*/\1/')
          echo "ANDROID_API=${API}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - name: Create the Android project (if it is not committed) and its icons
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init
            npx tauri icon app-icon.png
          fi
      - name: Point the project at the newest SDK (and optionally newer AGP / Gradle)
        run: |
          set -euo pipefail
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          sed -i -E "s/(compileSdk(Version)?\s*=\s*)[0-9]+/\1${ANDROID_API}/" "$GRADLE"
          sed -i -E "s/(targetSdk(Version)?\s*=\s*)[0-9]+/\1${ANDROID_API}/" "$GRADLE"
          # Don't fail if the Gradle plugin has not been "officially tested" with this API level yet
          echo "android.suppressUnsupportedCompileSdk=${ANDROID_API}" >> src-tauri/gen/android/gradle.properties

          if [ -n "$AGP_VERSION" ]; then
            sed -i -E "s/(com\.android\.tools\.build:gradle:)[0-9][^\"']*/\1${AGP_VERSION}/" src-tauri/gen/android/build.gradle.kts
          fi
          if [ -n "$GRADLE_VERSION" ]; then
            sed -i -E "s#(gradle-)[0-9.]+(-(bin|all)\.zip)#\1${GRADLE_VERSION}\2#" src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          fi
          grep -nE 'compileSdk|targetSdk' "$GRADLE"
      - name: Build the app bundle (.aab) and the APK
        run: |
          npx tauri android build --aab
          npx tauri android build --apk
      - name: Check target SDK and 16 KB pages
        run: |
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          TARGET=$(grep -oE 'targetSdk(Version)?\s*=\s*[0-9]+' "$GRADLE" | grep -oE '[0-9]+$' | head -n1 || true)
          echo "targetSdk: ${TARGET:-unknown}"
          if [ -n "$TARGET" ] && [ "$TARGET" -lt "$ANDROID_API" ]; then
            echo "::error::targetSdk is $TARGET, expected $ANDROID_API"; exit 1
          fi
          AAB=$(find src-tauri/gen/android -path '*outputs/bundle/*' -name '*.aab' | sort | head -n1)
          scripts/check-16kb.sh "$AAB"
      - name: Sign the bundle and the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p dist
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key configured (see docs/PLAY_STORE.md). Nothing is signed or published."
            exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks

          # App bundle for Google Play: signed with the upload key (jarsigner)
          AAB=$(find src-tauri/gen/android -path '*outputs/bundle/*' -name '*.aab' | sort | head -n1)
          jarsigner -keystore release.jks -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "dist/Ehrentag-Manager_${VER}_android.aab" "$AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "dist/Ehrentag-Manager_${VER}_android.aab" | tail -n 1

          # APK for the GitHub release (apksigner)
          APK=$(find src-tauri/gen/android -name "*-release-unsigned.apk" | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --out "dist/Ehrentag-Manager_${VER}_android.apk" aligned.apk
          rm -f release.jks aligned.apk
      - name: Keep the signed files (download the .aab here and upload it to Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            dist/*.aab
            dist/*.apk
      - name: Attach the signed APK to the release (the .aab is for Google Play only)
        if: hashFiles('dist/Ehrentag-Manager_*_android.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Ehrentag-Manager_*_android.apk

  checksums:
    name: Checksums
    needs: [desktop, android]
    if: always() && needs.desktop.result == 'success' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Create SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dist && cd dist
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern '*'
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
